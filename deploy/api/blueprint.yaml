# API host blueprint (container web service, one instance).
#
# The API is a long-lived process that keeps an SSE stream open and receives
# webhooks on a stable HTTPS origin: a container web service fits, a serverless
# function does not. See deploy/api/README.md for the steps.
#
# `sync: false` means Render asks for the value at creation time and never stores
# it in this file. Never commit real values here.

services:
  - type: web
    name: sps-api
    runtime: docker
    plan: free
    region: frankfurt
    rootDir: .
    dockerfilePath: ./apps/api/Dockerfile
    dockerContext: .
    healthCheckPath: /health
    autoDeployTrigger: commit
    envVars:
      # ── runtime ────────────────────────────────────────────────────────────
      - key: NODE_ENV
        value: production
      - key: SANDBOX_MODE
        value: cloud
      - key: RUN_BUDGET_USD
        value: "1.50"
      - key: AUDIT_ENABLED
        value: "true"
      - key: COT_TRACE_ENABLED
        value: "true"

      # ── model provider (Meta Model API) ────────────────────────────────────
      - key: MODEL_API_KEY
        sync: false
      - key: META_BASE_URL
        value: https://api.meta.ai/v1
      # The chat model is chosen in the console from GET /v1/models (Meta's list).
      - key: META_VOICE_MODEL
        value: muse-voice-transcribe-1.0

      # ── retrieval (Voyage + Atlas) ─────────────────────────────────────────
      - key: RETRIEVAL_BACKEND
        value: atlas
      - key: VOYAGE_API_KEY
        sync: false
      - key: VOYAGE_API_URL
        value: https://api.voyageai.com/v1
      - key: VOYAGE_EMBEDDING_MODEL
        value: voyage-4
      - key: VOYAGE_RERANK_MODEL
        value: rerank-2
      - key: EMBEDDING_DIMENSION
        value: "1024"
      - key: MONGODB_URI
        sync: false
      - key: MONGODB_DB_NAME
        value: policy_sandbox
      - key: MONGODB_RAG_COLLECTION
        value: kb_chunks
      - key: MONGODB_VECTOR_INDEX
        value: sps_vector_index
      - key: MONGODB_TEXT_INDEX
        value: sps_text_index
      - key: MONGODB_AUTO_INDEXES
        value: "true"

      # ── WhatsApp Cloud API ─────────────────────────────────────────────────
      - key: WHATSAPP_VERSION
        value: v26.0
      - key: WHATSAPP_PHONE_NUMBER_ID
        sync: false
      - key: WHATSAPP_WABA
        sync: false
      - key: WHATSAPP_ACCESS_TOKEN
        sync: false
      - key: WHATSAPP_WEBHOOK_VERIFY_TOKEN
        sync: false
      - key: WHATSAPP_APP_SECRET
        sync: false
      - key: WHATSAPP_RECIPIENT_WAID
        sync: false
      - key: WHATSAPP_TEMPLATE_LANGUAGE
        value: en

      # ── console origin (approval + e-mail links) ───────────────────────────
      - key: APPROVAL_SECRET
        sync: false
      # Set in the dashboard: no host is committed to the repository. The
      # canonical origin builds every link; aliases keep a previous domain (or a
      # preview) accepted by CORS during a switch. See apps/api/src/config.ts.
      - key: WEB_PUBLIC_URL
        sync: false
      - key: WEB_PUBLIC_URL_ALIASES
        sync: false

      # ── operator accounts ──────────────────────────────────────────────────
      # Public self-service sign-up for hackathon judges. The API also opens it
      # automatically in cloud mode; the explicit value survives a config drift.
      - key: AUTH_SIGNUP
        value: "true"
      - key: AUTH_MAX_OPERATORS
        value: "12"

      # ── bot protection (sign-up + password reset) ──────────────────────────
      # Cloudflare Turnstile. The site key is public (served to the console by
      # GET /v1/auth/captcha), the secret validates tokens. With no keys the
      # check is off; an unreachable Cloudflare never blocks a reset request.
      - key: NEXT_PUBLIC_CLOUDFLARE_TURNSITE_SITE_KEY
        sync: false
      - key: TURNSTILE_SECRET
        sync: false
      - key: TURNSTILE_HOSTNAMES
        sync: false
