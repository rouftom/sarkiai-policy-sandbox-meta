# API host blueprint (container web service, one instance).
#
# The API is a long-lived process that keeps an SSE stream open and receives
# webhooks on a stable HTTPS origin: a container web service fits, a serverless
# function does not. See deploy/api/README.md for the steps.
#
# `sync: false` means Render asks for the value at creation time and never stores
# it in this file. Never commit real values here.

services:
  - type: web
    name: sps-api
    runtime: docker
    plan: free
    region: frankfurt
    rootDir: .
    dockerfilePath: ./apps/api/Dockerfile
    dockerContext: .
    healthCheckPath: /health
    autoDeployTrigger: commit
    envVars:
      # ── runtime ────────────────────────────────────────────────────────────
      - key: NODE_ENV
        value: production
      - key: SANDBOX_MODE
        value: cloud
      - key: RUN_BUDGET_USD
        value: "1.50"
      - key: AUDIT_ENABLED
        value: "true"
      - key: COT_TRACE_ENABLED
        value: "true"

      # ── model provider (Meta Model API) ────────────────────────────────────
      - key: MODEL_API_KEY
        sync: false
      - key: META_BASE_URL
        value: https://api.meta.ai/v1
      # The chat model is chosen in the console from GET /v1/models (Meta's list).
      - key: META_VOICE_MODEL
        value: muse-voice-transcribe-1.0

      # ── corpus search (Atlas Search, agentic search on the Meta model) ─────
      - key: RETRIEVAL_BACKEND
        value: atlas
      - key: RETRIEVAL_DEPTH
        value: fast
      - key: MONGODB_URI
        sync: false
      - key: MONGODB_DB_NAME
        value: policy_sandbox
      - key: MONGODB_RAG_COLLECTION
        value: kb_chunks
      - key: MONGODB_TEXT_INDEX
        value: sps_text_index
      - key: MONGODB_AUTO_INDEXES
        value: "true"

      # ── WhatsApp Cloud API ─────────────────────────────────────────────────
      - key: WHATSAPP_VERSION
        value: v26.0
      - key: WHATSAPP_PHONE_NUMBER_ID
        sync: false
      - key: WHATSAPP_WABA
        sync: false
      - key: WHATSAPP_ACCESS_TOKEN
        sync: false
      - key: WHATSAPP_WEBHOOK_VERIFY_TOKEN
        sync: false
      - key: WHATSAPP_APP_SECRET
        sync: false
      - key: WHATSAPP_RECIPIENT_WAID
        sync: false
      - key: WHATSAPP_TEMPLATE_LANGUAGE
        value: en

      # ── console origin (approval + e-mail links) ───────────────────────────
      - key: APPROVAL_SECRET
        sync: false
      # Set in the dashboard: no host is committed to the repository. The
      # canonical origin builds every link; aliases keep a previous domain (or a
      # preview) accepted by CORS during a switch. See apps/api/src/config.ts.
      - key: WEB_PUBLIC_URL
        sync: false
      - key: WEB_PUBLIC_URL_ALIASES
        sync: false

      # ── operator accounts ──────────────────────────────────────────────────
      # Public self-service sign-up for hackathon judges. The API also opens it
      # automatically in cloud mode; the explicit value survives a config drift.
      - key: AUTH_SIGNUP
        value: "true"
      # Raised from 12 to 32 for the judging period (Nov 5-9, 2026).
      - key: AUTH_MAX_OPERATORS
        value: "32"

      # ── bot protection (sign-up + password reset) ──────────────────────────
      # Cloudflare Turnstile. The site key is public (served to the console by
      # GET /v1/auth/captcha), the secret validates tokens. With no keys the
      # check is off; an unreachable Cloudflare never blocks a reset request.
      - key: NEXT_PUBLIC_CLOUDFLARE_TURNSITE_SITE_KEY
        sync: false
      - key: TURNSTILE_SECRET
        sync: false
      - key: TURNSTILE_HOSTNAMES
        sync: false

      # ── request budgets ────────────────────────────────────────────────────
      # Per-caller rate limiting. The demo runs one instance; a burst of console
      # polls stays far below the global cap, and the model routes (readiness,
      # scenarios, chat, ingestion) have their own tighter budget. Raise these
      # if a legitimate workflow ever hits 429 (Retry-After says for how long).
      - key: RATE_LIMIT_ENABLED
        value: "true"
      - key: RATE_LIMIT_WINDOW_MS
        value: "60000"
      - key: RATE_LIMIT_MAX
        value: "240"
      - key: RATE_LIMIT_EXPENSIVE_MAX
        value: "20"

      # ── backpressure ───────────────────────────────────────────────────────
      # In-flight model work. A readiness series runs five streams at once, so
      # the per-operator default is above that; past the cap the API answers 429
      # at once instead of queueing. The dimensions cap bounds each stream's
      # internal fan-out (13 cells per sector otherwise).
      - key: AI_CONCURRENCY_PER_OPERATOR
        value: "8"
      - key: AI_CONCURRENCY_GLOBAL
        value: "16"
      - key: READINESS_DIMENSION_CONCURRENCY
        value: "4"

      # ── Mongo pools ────────────────────────────────────────────────────────
      # Every service opens its own client; each is bounded so a slow cluster
      # queues at most this many connections for at most this long.
      - key: MONGODB_MAX_POOL_SIZE
        value: "10"
      - key: MONGODB_WAIT_QUEUE_TIMEOUT_MS
        value: "5000"
