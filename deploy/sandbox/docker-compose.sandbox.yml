# ─────────────────────────────────────────────────────────────────────────────
# Locked-down sandbox deployment (air-gapped, on-premise).
#
# Differences from the local stack:
#   - Vector KB runs on Qdrant (bundled here, or point QDRANT_URL at a managed
#     instance provided by the Lab).
#   - Operational store (audit + CoT) points at the Mongo cluster provided by
#     the Lab (MONGODB_URI is injected by the sandbox).
#   - Images are pulled from the registry unless built locally.
#
#   MONGODB_URI="mongodb+srv://..." QDRANT_URL="https://qdrant.lab" \
#     docker compose --env-file .env.sandbox \
#     -f deploy/sandbox/docker-compose.sandbox.yml up -d
# ─────────────────────────────────────────────────────────────────────────────

name: sps-sandbox

services:
  # Local model server (LLM + embeddings) · the sandbox must also be sovereign.
  ollama:
    image: ollama/ollama:latest
    restart: unless-stopped
    volumes:
      - ollama-data:/root/.ollama
    expose: ["11434"]
    # GPU support: uncomment for NVIDIA on the sandbox host.
    healthcheck:
      test: ["CMD-SHELL", "ollama list >/dev/null 2>&1 || exit 1"]
      interval: 15s
      timeout: 10s
      retries: 10
      start_period: 30s
    networks: [sps]

  minio:
    image: minio/minio:latest
    restart: unless-stopped
    command: ["server", "/data", "--console-address", ":9001"]
    environment:
      MINIO_ROOT_USER: ${S3_ACCESS_KEY:?set S3_ACCESS_KEY}
      MINIO_ROOT_PASSWORD: ${S3_SECRET_KEY:?set S3_SECRET_KEY}
    volumes:
      - minio-data:/data
    expose: ["9000", "9001"]
    healthcheck:
      test: ["CMD", "mc", "ready", "local"]
      interval: 10s
      timeout: 5s
      retries: 10
    networks: [sps]

  minio-init:
    image: minio/mc:latest
    depends_on:
      minio:
        condition: service_healthy
    entrypoint:
      - sh
      - -c
      - >
        mc alias set local http://minio:9000 "$$MINIO_ROOT_USER" "$$MINIO_ROOT_PASSWORD" &&
        mc mb --ignore-existing local/"$$S3_BUCKET"
    environment:
      MINIO_ROOT_USER: ${S3_ACCESS_KEY}
      MINIO_ROOT_PASSWORD: ${S3_SECRET_KEY}
      S3_BUCKET: ${S3_BUCKET:-sps-attachments}
    restart: "no"
    networks: [sps]

  qdrant:
    image: qdrant/qdrant:v1.12.4
    restart: unless-stopped
    volumes:
      - qdrant-data:/qdrant/storage
    environment:
      QDRANT__SERVICE__API_KEY: ${QDRANT_API_KEY:-}
      QDRANT__LOG_LEVEL: ${QDRANT_LOG_LEVEL:-INFO}
    # Not exposed publicly by default in the sandbox; internal network only.
    expose: ["6333", "6334"]
    networks: [sps]

  ingestion:
    image: ${SPS_REGISTRY:?set SPS_REGISTRY}/sps-ingestion:${SPS_TAG:-latest}
    build:
      context: ../..
      dockerfile: services/ingestion/Dockerfile
    restart: unless-stopped
    depends_on:
      - qdrant
      - ollama
    environment:
      PORT: "8000"
      QDRANT_URL: ${QDRANT_URL:-http://qdrant:6333}
      QDRANT_API_KEY: ${QDRANT_API_KEY:-}
      QDRANT_COLLECTION: ${QDRANT_COLLECTION:-policy_chunks}
      OLLAMA_URL: ${OLLAMA_URL:-http://ollama:11434}
      EMBEDDING_MODEL: ${EMBEDDING_MODEL:-bge-m3}
      OCR_URL: http://ocr:8000
      SERVICE_API_KEY: ${SERVICE_API_KEY:?set SERVICE_API_KEY}
    expose: ["8000"]
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request,sys; sys.exit(0 if urllib.request.urlopen('http://localhost:8000/health').status==200 else 1)"]
      interval: 15s
      timeout: 5s
      retries: 5
    networks: [sps]

  ocr:
    image: ${SPS_REGISTRY:?set SPS_REGISTRY}/sps-ocr:${SPS_TAG:-latest}
    build:
      context: ../..
      dockerfile: services/ocr/Dockerfile
    restart: unless-stopped
    environment:
      PORT: "8000"
      OCR_LANGUAGES: ${OCR_LANGUAGES:-fra+eng}
      SERVICE_API_KEY: ${SERVICE_API_KEY}
    expose: ["8000"]
    networks: [sps]

  api:
    image: ${SPS_REGISTRY:?set SPS_REGISTRY}/sps-api:${SPS_TAG:-latest}
    build:
      context: ../..
      dockerfile: apps/api/Dockerfile
      target: prod
    restart: unless-stopped
    depends_on:
      ingestion:
        condition: service_healthy
    environment:
      PORT: "8000"
      QDRANT_URL: ${QDRANT_URL:-http://qdrant:6333}
      QDRANT_API_KEY: ${QDRANT_API_KEY:-}
      QDRANT_COLLECTION: ${QDRANT_COLLECTION:-policy_chunks}
      MONGODB_URI: ${MONGODB_URI:?set MONGODB_URI to the Lab operational cluster}
      MONGODB_DB_NAME: ${MONGODB_DB_NAME:-policy_sandbox}
      INGESTION_URL: http://ingestion:8000
      OLLAMA_BASE_URL: ${OLLAMA_URL:-http://ollama:11434}
      OLLAMA_MODEL: ${OLLAMA_MODEL:-muse-glimmer}
      EMBEDDING_MODEL: ${EMBEDDING_MODEL:-bge-m3}
      RERANK_URL: ${RERANK_URL:-}
      RERANK_MODEL: ${RERANK_MODEL:-BAAI/bge-reranker-v2-m3}
      OCR_URL: http://ocr:8000
      S3_ENDPOINT: ${S3_ENDPOINT:-http://minio:9000}
      S3_BUCKET: ${S3_BUCKET:-sps-attachments}
      S3_ACCESS_KEY: ${S3_ACCESS_KEY}
      S3_SECRET_KEY: ${S3_SECRET_KEY}
      SERVICE_API_KEY: ${SERVICE_API_KEY}
    ports:
      - "${API_PORT:-8000}:8000"
    networks: [sps]

  web:
    image: ${SPS_REGISTRY:?set SPS_REGISTRY}/sps-web:${SPS_TAG:-latest}
    build:
      context: ../..
      dockerfile: apps/web/Dockerfile
      target: prod
      args:
        NEXT_PUBLIC_API_URL: ${NEXT_PUBLIC_API_URL:-http://localhost:8000}
    restart: unless-stopped
    depends_on:
      - api
    environment:
      PORT: "3000"
      NEXT_PUBLIC_API_URL: ${NEXT_PUBLIC_API_URL:-http://localhost:8000}
    ports:
      - "${WEB_PORT:-3000}:3000"
    networks: [sps]

volumes:
  ollama-data:
  qdrant-data:
  minio-data:

networks:
  sps:
    driver: bridge
