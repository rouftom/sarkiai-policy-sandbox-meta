<text class="sub" x="440" y="248">served by Baseten</text>
<text class="sub" x="440" y="268">SAM 3.1 and speech stay on the</text>
<text class="sub" x="440" y="288">Meta Model API when used</text>
<rect x="422" y="370" width="356" height="130" rx="14" fill="#2B1D1C" stroke="#FF8A65" stroke-width="2"/>
<text class="tagh" x="440" y="398">DATA BOUNDARY</text>
<text class="name" x="440" y="424">What leaves</text>
<text class="sub" x="440" y="448">Prompts: to the Baseten deployment;</text>
<text class="sub" x="440" y="468">scans and voice: Meta Model API</text>
<rect x="800" y="150" width="356" height="180" rx="14" fill="#14263F" stroke="#5AA9FF" stroke-width="2"/>
<text class="tag" x="818" y="178">LOCAL</text>
<text class="name" x="818" y="204">Muse Glimmer</text>
<text class="sub" x="818" y="228">30B open weights on Ollama</text>
<text class="sub" x="818" y="248">Corpus: MongoDB text index</text>
<text class="sub" x="818" y="268">Segmentation and voice need the</text>
<text class="sub" x="818" y="288">Meta Model API</text>
<rect x="800" y="370" width="356" height="130" rx="14" fill="#2B1D1C" stroke="#FF8A65" stroke-width="2"/>
<text class="tagh" x="818" y="398">DATA BOUNDARY</text>
<text class="name" x="818" y="424">What leaves</text>
<text class="sub" x="818" y="448">Nothing leaves the</text>
<text class="sub" x="818" y="468">institution</text>
<text class="tags" x="60" y="562">IN EVERY MODE</text>
<text class="legend" x="64" y="590" text-anchor="start">·  The model id of every step is recorded in the hash-chained audit trail</text>
<text class="legend" x="64" y="622" text-anchor="start">·  Model chosen per operator, per request; sessions are revocable</text>
<text class="legend" x="64" y="654" text-anchor="start">·  Corpus, countries, address book and messages: administrators only</text>
<text class="legend" x="64" y="686" text-anchor="start">·  Model output sanitized, Content-Security-Policy, signed webhooks</text>
<text class="legend" x="64" y="718" text-anchor="start">·  Containers run without root; CI blocks high and critical advisories</text>
</svg>
