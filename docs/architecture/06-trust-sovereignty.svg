<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 824" width="1200" height="824" role="img" aria-labelledby="t d">
<title id="t">SarkiAI Policy Sandbox: deployment modes, data boundaries and controls</title>
<desc id="d">Three modes run the same engine. In the cloud, reasoning, vision, segmentation and speech run on the Meta Model API. In sovereign mode, reasoning runs on Muse Spark Open, served by Baseten. In local mode, Muse Glimmer runs on the institution's own hardware and nothing leaves it; segmentation and voice need the Meta Model API. In every mode the model of each step is recorded in the audit chain, sessions are revocable, shared state is reserved to administrators, model output is sanitized and the containers run without root.</desc>
<defs><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="5" markerHeight="5" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#5A6B85"/></marker>
