<text class="name" x="62" y="424">What leaves</text>
<text class="sub" x="62" y="448">Prompts and scans go to the</text>
<text class="sub" x="62" y="468">Meta Model API</text>
<rect x="422" y="150" width="356" height="180" rx="14" fill="#14263F" stroke="#5AA9FF" stroke-width="2"/>
