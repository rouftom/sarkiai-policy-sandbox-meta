<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 914" width="1200" height="914" role="img" aria-labelledby="t d">
<title id="t">SarkiAI Policy Sandbox: one incident run, from the first event to the joint report</title>
<desc id="d">A scenario timeline, such as a health-data breach at a public hospital in Cameroon, releases events tick by tick. Each institution only sees what it would know in reality. Four mandated agents on Muse Spark search the law and assess the event. The citation validator rejects any quote that is not in the corpus; the agent answers again, and after the last attempt the point is reported as a gap. The coordinator reconciles the assessments into a joint situation report with agreements, mandate conflicts and unresolved questions. Focal points decide through a signed single-use link. Every step is recorded in the hash-chained audit trail.</desc>
