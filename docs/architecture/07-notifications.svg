<rect class="band" x="44" y="600" width="1112" height="80" rx="16"/>
<rect x="1004" y="52" width="14" height="14" rx="4" fill="#121925" stroke="#50627C" stroke-width="1.5" stroke-dasharray="4 3"/><text class="legend" x="1026" y="64">External service</text>
<rect x="786" y="52" width="14" height="14" rx="4" fill="#2B1D1C" stroke="#FF8A65" stroke-width="2"/><text class="legend" x="808" y="64">People and institutions</text>
<rect x="635" y="52" width="14" height="14" rx="4" fill="#151D2C" stroke="#2A3648" stroke-width="1.5"/><text class="legend" x="657" y="64">SarkiAI engine</text>
<rect x="515" y="52" width="14" height="14" rx="4" fill="#14263F" stroke="#5AA9FF" stroke-width="2"/><text class="legend" x="537" y="64">Meta model</text>
<rect x="44" y="150" width="260" height="110" rx="14" fill="#151D2C" stroke="#2A3648" stroke-width="1.5"/>
<text class="tags" x="62" y="178">OUTPUT</text>
<text class="name" x="62" y="204">Joint report ready</text>
<text class="sub" x="62" y="228">From the coordinator</text>
<rect x="44" y="300" width="260" height="130" rx="14" fill="#2B1D1C" stroke="#FF8A65" stroke-width="2"/>
<text class="name" x="62" y="328">Administrator sends</text>
<text class="sub" x="62" y="352">Approval request,</text>
<text class="sub" x="62" y="372">administrators only</text>
<rect x="360" y="150" width="330" height="110" rx="14" fill="#121925" stroke="#50627C" stroke-width="1.5" stroke-dasharray="6 5"/>
<text class="name" x="378" y="178">WhatsApp Cloud API</text>
<text class="sub" x="378" y="202">Approved utility templates</text>
<rect x="360" y="300" width="330" height="110" rx="14" fill="#121925" stroke="#50627C" stroke-width="1.5" stroke-dasharray="6 5"/>
<text class="name" x="378" y="328">E-mail</text>
<text class="sub" x="378" y="352">React Email, sent through Resend</text>
<rect x="750" y="150" width="406" height="130" rx="14" fill="#2B1D1C" stroke="#FF8A65" stroke-width="2"/>
<text class="name" x="768" y="178">Focal point</text>
<text class="sub" x="768" y="202">Receives the request and a</text>
<text class="sub" x="768" y="222">signed, single-use link</text>
<rect x="750" y="320" width="406" height="110" rx="14" fill="#151D2C" stroke="#2A3648" stroke-width="1.5"/>
<text class="tags" x="768" y="348">CONSOLE</text>
<text class="name" x="768" y="374">Decision page</text>
<text class="sub" x="768" y="398">Approve or reject in the console</text>
<rect x="750" y="460" width="406" height="110" rx="14" fill="#151D2C" stroke="#2A3648" stroke-width="1.5"/>
<text class="tags" x="768" y="488">API</text>
<text class="name" x="768" y="514">Signed webhook</text>
<text class="sub" x="768" y="538">Inbound events accepted only</text>
<text class="sub" x="768" y="558">with a valid signature</text>
<text class="tags" x="60" y="622">AUDIT</text>
<text class="legend" x="60" y="650" text-anchor="start">Every send, delivery event and decision lands in the same hash-chained audit trail as every agent step.</text>
</svg>
