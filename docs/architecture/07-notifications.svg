<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 784" width="1200" height="784" role="img" aria-labelledby="t d">
<title id="t">SarkiAI Policy Sandbox: notifications and the approval loop</title>
<desc id="d">When a joint report is ready, an administrator sends an approval request. WhatsApp messages use approved utility templates through the WhatsApp Cloud API; e-mails use the transactional e-mail templates. The focal point opens a signed, single-use link that leads to the decision page in the console and approves or rejects. Inbound WhatsApp webhooks are accepted only with a valid signature. Every send and every decision lands in the hash-chained audit trail.</desc>
