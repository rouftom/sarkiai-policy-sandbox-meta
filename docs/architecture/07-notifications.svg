<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 720" width="1200" height="720" role="img" aria-labelledby="t d">
<title id="t">SarkiAI Policy Sandbox: notifications and the approval loop</title>
<desc id="d">When a joint report is ready, an administrator sends an approval request. WhatsApp messages use approved utility templates through the WhatsApp Cloud API; e-mails are rendered with React Email and sent through Resend. The focal point opens a signed, single-use link that leads to the decision page in the console and approves or rejects. Inbound WhatsApp webhooks are accepted only with a valid signature. Every send and every decision lands in the hash-chained audit trail.</desc>
<defs><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#50627C"/></marker>
<marker id="am" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#5AA9FF"/></marker></defs>
<style>
.kicker{font:600 15px 'Inter','Segoe UI',Roboto,Helvetica,Arial,sans-serif;letter-spacing:2.5px;fill:#A9B4C6}
.head{font:700 32px 'Inter','Segoe UI',Roboto,Helvetica,Arial,sans-serif;fill:#F2F5FA}
