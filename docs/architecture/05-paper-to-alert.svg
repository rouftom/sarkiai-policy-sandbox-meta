<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 804" width="1200" height="804" role="img" aria-labelledby="t d">
<title id="t">SarkiAI Policy Sandbox: from a scanned official gazette to an impact alert</title>
<desc id="d">A scanned page of the official gazette has no text layer. The pipeline finds its columns and zones. SAM 3.1 locates stamps, signatures and tables so that they never pollute the legal text, and Muse Spark transcribes each zone with its provenance. An administrator adds the page to the corpus, where text zones and tables become one lexically indexed page document; stamps and signatures stay in the overlay and are never retrieved as law. The impact analysis then reads every open incident: Muse Spark flags the ones the new text changes, with severity, changed deadlines and actions, and it cannot add a run.</desc>
<defs><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="5" markerHeight="5" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#5A6B85"/></marker>
