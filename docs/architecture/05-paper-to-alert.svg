<text class="tags" x="62" y="178">SOURCE</text>
<text class="name" x="62" y="204">Official gazette</text>
<text class="sub" x="62" y="228">A scanned page,</text>
<text class="sub" x="62" y="248">no text layer</text>
<rect x="44" y="310" width="250" height="110" rx="14" fill="#151D2C" stroke="#2A3648" stroke-width="1.5"/>
<text class="tags" x="62" y="338">LAYOUT</text>
<text class="name" x="62" y="364">Columns and zones</text>
<text class="sub" x="62" y="388">The page layout, zone by zone</text>
<rect x="350" y="150" width="380" height="130" rx="14" fill="#14263F" stroke="#5AA9FF" stroke-width="2"/>
<text class="tag" x="368" y="178">META MODEL · SEGMENTATION</text>
<text class="name" x="368" y="204">SAM 3.1</text>
<text class="sub" x="368" y="228">Finds stamps, signatures and tables</text>
<text class="sub" x="368" y="248">They stay in the overlay,</text>
<text class="sub" x="368" y="268">never retrieved as law</text>
<rect x="350" y="310" width="380" height="110" rx="14" fill="#14263F" stroke="#5AA9FF" stroke-width="2"/>
<text class="tag" x="368" y="338">META MODEL · VISION</text>
<text class="name" x="368" y="364">Muse Spark</text>
<text class="sub" x="368" y="388">Transcribes each zone,</text>
<text class="sub" x="368" y="408">every line keeps its provenance</text>
<rect x="790" y="150" width="366" height="130" rx="14" fill="#151D2C" stroke="#2A3648" stroke-width="1.5"/>
<text class="tags" x="808" y="178">KNOWLEDGE BASE</text>
<text class="name" x="808" y="204">Corpus</text>
<text class="sub" x="808" y="228">Text zones and tables become one</text>
<text class="sub" x="808" y="248">page document, lexically indexed</text>
<text class="sub" x="808" y="268">Added by an administrator</text>
<rect x="790" y="320" width="366" height="150" rx="14" fill="#14263F" stroke="#5AA9FF" stroke-width="2"/>
<text class="tag" x="808" y="348">META MODEL · MUSE SPARK</text>
<text class="name" x="808" y="374">Impact analysis</text>
<text class="sub" x="808" y="398">Reads every open incident</text>
<text class="sub" x="808" y="418">Flags the runs the text changes</text>
<text class="sub" x="808" y="438">It cannot add a run</text>
<rect x="790" y="510" width="366" height="130" rx="14" fill="#2B1D1C" stroke="#FF8A65" stroke-width="2"/>
<text class="name" x="808" y="538">Affected incidents</text>
<text class="sub" x="808" y="562">Severity, changed deadlines,</text>
<text class="sub" x="808" y="582">actions: re-run the joint reports</text>
<text class="note" x="44" y="700" text-anchor="start">In the demo: a sample decree replaces "a reasonable delay" with 72 hours for the health-data breach run, severity High.</text>
