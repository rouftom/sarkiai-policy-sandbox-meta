<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 904" width="1200" height="904" role="img" aria-labelledby="t d">
<title id="t">SarkiAI Policy Sandbox: the agentic corpus search</title>
<desc id="d">A question is planned by the Meta model of the mode, which splits it into sub-questions with short legal queries in French and English. One sub-agent per sub-question runs its queries on the lexical BM25 index, which is a scoring formula and not a model, and reads the whole article its best passages belong to. In deep mode, the model judges whether the passages answer the sub-question and the sub-agent loops with refined queries, two rounds at most. The lists are merged by reciprocal rank fusion, the model ranks the candidates in one call, and the citation validator still checks every quote. Three depths bound the cost: lexical, fast and deep.</desc>
