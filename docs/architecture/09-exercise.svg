<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 644" width="1200" height="644" role="img" aria-labelledby="t d">
<title id="t">SarkiAI Policy Sandbox: a table-top crisis exercise</title>
<desc id="d">Injects arrive on a clock. The team logs what it does. The score is computed from the log by rules, not by the model: each inject is addressed, late or missed, and an inject can only move from missed to addressed. Muse Spark then writes the after-action report, which cannot change the score. The exercise is recorded in the audit trail.</desc>
<defs><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#5A6B85"/></marker>
<marker id="am" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#0866FF"/></marker></defs>
<style>
.brand{font:700 15px 'Montserrat','Inter','Segoe UI',Roboto,Helvetica,Arial,sans-serif;fill:#0A1633}
.edition{font:500 13px 'Inter','Segoe UI',Roboto,Helvetica,Arial,sans-serif;fill:#5A6B85}
.kicker{font:700 13px 'Inter','Segoe UI',Roboto,Helvetica,Arial,sans-serif;letter-spacing:2.2px;fill:#0866FF}
.head{font:700 30px 'Montserrat','Inter','Segoe UI',Roboto,Helvetica,Arial,sans-serif;fill:#0A1633}
.name{font:700 18px 'Inter','Segoe UI',Roboto,Helvetica,Arial,sans-serif;fill:#0A1633}
.sub{font:400 14px 'Inter','Segoe UI',Roboto,Helvetica,Arial,sans-serif;fill:#46546B}
.note{font:italic 400 14px 'Inter','Segoe UI',Roboto,Helvetica,Arial,sans-serif;fill:#5A6B85}
.tag{font:700 10.5px 'Inter','Segoe UI',Roboto,Helvetica,Arial,sans-serif;letter-spacing:1.4px;fill:#0866FF}
.tagh{font:700 10.5px 'Inter','Segoe UI',Roboto,Helvetica,Arial,sans-serif;letter-spacing:1.4px;fill:#0B8A62}
.tags{font:700 10.5px 'Inter','Segoe UI',Roboto,Helvetica,Arial,sans-serif;letter-spacing:1.4px;fill:#5A6B85}
.legend{font:500 13px 'Inter','Segoe UI',Roboto,Helvetica,Arial,sans-serif;fill:#46546B}
.foot{font:500 12px 'Inter','Segoe UI',Roboto,Helvetica,Arial,sans-serif;fill:#8A97AD}
.flow{fill:none;stroke:#5A6B85;stroke-width:1.8}
.dash{fill:none;stroke:#5A6B85;stroke-width:1.8;stroke-dasharray:6 5}
.metaflow{fill:none;stroke:#0866FF;stroke-width:2}
.band{fill:#EEF3FB;stroke:#C9D3E3;stroke-width:1}
</style>
<rect width="1200" height="644" fill="#F7F9FC"/>
<rect x="0" y="0" width="1200" height="6" fill="#0866FF"/>
<g transform="translate(44,26) scale(0.9)"><path d="M20 2.5 35 7.5v12.2c0 8.4-6 15.6-15 18.8-9-3.2-15-10.4-15-18.8V7.5L20 2.5Z" fill="#0866FF"/><path d="M20 10.5c4.6 2.7 7 6.4 7 10.6 0 4.5-3.1 7.6-7 8.9-3.9-1.3-7-4.4-7-8.9 0-4.2 2.4-7.9 7-10.6Z" fill="#FFFFFF" fill-opacity="0.22" stroke="#FFFFFF" stroke-opacity="0.7" stroke-width="1"/><path d="M20 13.5v14.1M20 19.2c1.9-1.6 4-2.4 6.2-2.4M20 23.5c-1.9-1.6-4-2.4-6.2-2.4" stroke="#FFFFFF" stroke-width="1.3" stroke-linecap="round" fill="none"/></g>
<text class="brand" x="84" y="46">SarkiAI Policy Sandbox</text>
<text class="edition" x="84" y="64">Meta edition</text>
<text class="kicker" x="44" y="100">TABLE-TOP EXERCISE</text>
<text class="head" x="44" y="136">Rules score the team. The model writes the report.</text>
<line x1="44" y1="604" x2="1156" y2="604" stroke="#D5DDEA" stroke-width="1"/>
<text class="foot" x="44" y="626">Djotta · Douala, Cameroon</text>
<text class="foot" x="1156" y="626" text-anchor="end">github.com/rouftom/sarkiai-policy-sandbox-meta</text>
<rect x="1004" y="36" width="14" height="14" fill="#F7F9FC" stroke="#8A97AD" stroke-width="1.5" stroke-dasharray="4 3"/><text class="legend" x="1026" y="48">External service</text>
<rect x="786" y="36" width="14" height="14" fill="#E8F7F1" stroke="#10AA78" stroke-width="2"/><text class="legend" x="808" y="48">People and institutions</text>
<rect x="635" y="36" width="14" height="14" fill="#FFFFFF" stroke="#0A1633" stroke-width="1.5"/><text class="legend" x="657" y="48">SarkiAI engine</text>
<rect x="515" y="36" width="14" height="14" fill="#EAF2FF" stroke="#0866FF" stroke-width="2"/><text class="legend" x="537" y="48">Meta model</text>
<g transform="translate(0,44)"><path class="flow" d="M274 210 H310" marker-end="url(#a)"/><path class="flow" d="M544 210 H580" marker-end="url(#a)"/><path class="metaflow" d="M840 225 H876" marker-end="url(#am)"/>
<rect class="band" x="44" y="340" width="1112" height="90" rx="2"/>
<rect x="44" y="150" width="230" height="120" rx="2" fill="#FFFFFF" stroke="#0A1633" stroke-width="1.5"/>
<text class="tags" x="62" y="178">EXERCISE</text>
<text class="name" x="62" y="204">Timed injects</text>
<text class="sub" x="62" y="228">Events arrive on a clock</text>
<rect x="314" y="150" width="230" height="120" rx="2" fill="#E8F7F1" stroke="#10AA78" stroke-width="2"/>
<text class="name" x="332" y="178">The team</text>
<text class="sub" x="332" y="202">Logs every action</text>
<text class="sub" x="332" y="222">it takes</text>
<rect x="584" y="150" width="256" height="150" rx="2" fill="#FFFFFF" stroke="#0A1633" stroke-width="1.5"/>
<text class="tags" x="602" y="178">NO MODEL</text>
<text class="name" x="602" y="204">Rule-based score</text>
<text class="sub" x="602" y="228">Addressed, late or missed,</text>
<text class="sub" x="602" y="248">computed from the log</text>
<text class="sub" x="602" y="268">Missed can turn into addressed</text>
<rect x="880" y="150" width="276" height="150" rx="2" fill="#EAF2FF" stroke="#0866FF" stroke-width="2"/>
<text class="tag" x="898" y="178">META MODEL</text>
<text class="name" x="898" y="204">After-action report</text>
<text class="sub" x="898" y="228">Written by Muse Spark</text>
<text class="sub" x="898" y="248">It cannot change the score</text>
<text class="tags" x="60" y="362">AUDIT</text>
<text class="legend" x="60" y="390" text-anchor="start">The injects, the actions, the score and the report are recorded in the hash-chained audit trail.</text>
<text class="note" x="44" y="490" text-anchor="start">A fluent report cannot hide a missed inject: the score is fixed before the model writes a word.</text>
</g>
</svg>
