<text class="name" x="62" y="178">You ask</text>
<text class="sub" x="62" y="202">Type, dictate or attach an image</text>
<text class="sub" x="62" y="222">Pick a mandated institution</text>
<rect x="44" y="310" width="290" height="120" rx="2" fill="#EAF2FF" stroke="#0866FF" stroke-width="2"/>
<text class="tag" x="62" y="338">META MODEL · SPEECH</text>
<text class="name" x="62" y="364">Muse Voice Transcribe</text>
<text class="sub" x="62" y="388">Realtime WebSocket</text>
<text class="sub" x="62" y="408">Words appear as you talk</text>
<rect x="44" y="470" width="290" height="120" rx="2" fill="#FFFFFF" stroke="#0A1633" stroke-width="1.5"/>
<text class="tags" x="62" y="498">ATTACHMENTS</text>
<text class="name" x="62" y="524">Media library</text>
<text class="sub" x="62" y="548">Images uploaded at selection,</text>
<text class="sub" x="62" y="568">sent as references, not base64</text>
<rect x="390" y="270" width="320" height="200" rx="2" fill="#EAF2FF" stroke="#0866FF" stroke-width="2"/>
<text class="tag" x="408" y="298">META MODEL · THE BRAIN</text>
<text class="name" x="408" y="324">Muse Spark 1.3</text>
<text class="sub" x="408" y="348">Or the model the operator chose:</text>
<text class="sub" x="408" y="368">Muse Spark Open, Muse Glimmer</text>
<text class="sub" x="408" y="388">Reads attached images</text>
<text class="sub" x="408" y="408">Streams its answer and its</text>
<text class="sub" x="408" y="428">tool calls</text>
<rect x="770" y="140" width="386" height="110" rx="2" fill="#EAF2FF" stroke="#0866FF" stroke-width="2"/>
<text class="tag" x="788" y="168">TOOL · AGENTIC SEARCH</text>
<text class="name" x="788" y="194">search_corpus</text>
<text class="sub" x="788" y="218">Depth deep: plan, sub-agents,</text>
<text class="sub" x="788" y="238">judge loops, Meta ranking</text>
<rect x="770" y="270" width="386" height="96" rx="2" fill="#FFFFFF" stroke="#0A1633" stroke-width="1.5"/>
<text class="tags" x="788" y="298">TOOL</text>
<text class="name" x="788" y="324">record_gap</text>
<text class="sub" x="788" y="348">Says what the law does not cover</text>
<rect x="770" y="386" width="386" height="110" rx="2" fill="#F7F9FC" stroke="#8A97AD" stroke-width="1.5" stroke-dasharray="6 5"/>
<text class="tags" x="788" y="414">TOOL · MCP</text>
<text class="name" x="788" y="440">MCP apps</text>
<text class="sub" x="788" y="464">mcp_list_tools, mcp_call_tool:</text>
<text class="sub" x="788" y="484">charts and documents in the chat</text>
<rect x="770" y="516" width="386" height="110" rx="2" fill="#E8F7F1" stroke="#10AA78" stroke-width="2"/>
<text class="tagh" x="788" y="544">TOOL · HUMAN IN THE LOOP</text>
<text class="name" x="788" y="570">ask_user · request_approval</text>
<text class="sub" x="788" y="594">The agent proposes,</text>
<text class="sub" x="788" y="614">an operator decides</text>
<rect x="390" y="560" width="320" height="110" rx="2" fill="#FFFFFF" stroke="#0A1633" stroke-width="1.5"/>
<text class="tags" x="408" y="588">GUARD</text>
<text class="name" x="408" y="614">Citation validator</text>
<text class="sub" x="408" y="638">Every quote checked against</text>
<text class="sub" x="408" y="658">the corpus before it is shown</text>
<rect x="44" y="650" width="290" height="110" rx="2" fill="#E8F7F1" stroke="#10AA78" stroke-width="2"/>
<text class="name" x="62" y="678">The answer</text>
<text class="sub" x="62" y="702">Clickable sources, recorded</text>
<text class="sub" x="62" y="722">in the hash-chained audit trail</text>
