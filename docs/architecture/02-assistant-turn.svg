<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 800" width="1200" height="800" role="img" aria-labelledby="t d">
<title id="t">SarkiAI Policy Sandbox: one assistant turn through the Meta models</title>
<desc id="d">The operator types, dictates or attaches an image. Muse Voice Transcribe turns speech into text over a realtime WebSocket; images are uploaded when selected and sent as references. Muse Spark, or the model chosen by the operator, reads the question and the image and calls its tools: the agentic corpus search in deep mode, record_gap when the law does not cover a point, MCP apps for charts and documents, and ask_user or request_approval so that a person decides. Every quote is checked against the corpus by the citation validator before the answer is shown, and the turn is recorded in the hash-chained audit trail.</desc>
<defs><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#50627C"/></marker>
<marker id="am" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#5AA9FF"/></marker></defs>
<style>
.kicker{font:600 15px 'Inter','Segoe UI',Roboto,Helvetica,Arial,sans-serif;letter-spacing:2.5px;fill:#A9B4C6}
.head{font:700 32px 'Inter','Segoe UI',Roboto,Helvetica,Arial,sans-serif;fill:#F2F5FA}
.name{font:700 19px 'Inter','Segoe UI',Roboto,Helvetica,Arial,sans-serif;fill:#F2F5FA}
.sub{font:400 14.5px 'Inter','Segoe UI',Roboto,Helvetica,Arial,sans-serif;fill:#A9B4C6}
.note{font:italic 400 14.5px 'Inter','Segoe UI',Roboto,Helvetica,Arial,sans-serif;fill:#A9B4C6}
.tag{font:700 11px 'Inter','Segoe UI',Roboto,Helvetica,Arial,sans-serif;letter-spacing:1.4px;fill:#5AA9FF}
.tagh{font:700 11px 'Inter','Segoe UI',Roboto,Helvetica,Arial,sans-serif;letter-spacing:1.4px;fill:#FF8A65}
.tags{font:700 11px 'Inter','Segoe UI',Roboto,Helvetica,Arial,sans-serif;letter-spacing:1.4px;fill:#7F8DA3}
.legend{font:500 14px 'Inter','Segoe UI',Roboto,Helvetica,Arial,sans-serif;fill:#A9B4C6}
.flow{fill:none;stroke:#50627C;stroke-width:2}
.dash{fill:none;stroke:#50627C;stroke-width:2;stroke-dasharray:6 6}
.metaflow{fill:none;stroke:#5AA9FF;stroke-width:2}
.band{fill:#111827;stroke:#2A3648;stroke-width:1.5;stroke-dasharray:4 6}
</style>
<rect width="1200" height="800" rx="22" fill="#0E1420"/>
<text class="kicker" x="44" y="62">ONE ASSISTANT TURN</text>
<text class="head" x="44" y="102">Meta's models hear, read, search and answer.</text>
<path class="flow" d="M189 270 V306" marker-end="url(#a)"/><path class="metaflow" d="M334 370 C 362 370, 362 340, 386 340" marker-end="url(#am)"/><path class="flow" d="M334 530 C 362 530, 362 420, 386 420" marker-end="url(#a)"/><path class="flow" d="M189 270 C 189 290, 360 290, 386 300" marker-end="url(#a)"/><path class="metaflow" d="M710 300 C 740 300, 740 195, 766 195" marker-end="url(#am)"/><path class="flow" d="M710 330 C 740 330, 740 318, 766 318" marker-end="url(#a)"/><path class="flow" d="M710 380 C 740 380, 740 441, 766 441" marker-end="url(#a)"/><path class="flow" d="M710 430 C 740 430, 740 571, 766 571" marker-end="url(#a)"/><path class="flow" d="M550 470 V556" marker-end="url(#a)"/><path class="flow" d="M390 615 C 360 615, 360 705, 338 705" marker-end="url(#a)"/>
<rect x="1004" y="52" width="14" height="14" rx="4" fill="#121925" stroke="#50627C" stroke-width="1.5" stroke-dasharray="4 3"/><text class="legend" x="1026" y="64">External service</text>
<rect x="786" y="52" width="14" height="14" rx="4" fill="#2B1D1C" stroke="#FF8A65" stroke-width="2"/><text class="legend" x="808" y="64">People and institutions</text>
<rect x="635" y="52" width="14" height="14" rx="4" fill="#151D2C" stroke="#2A3648" stroke-width="1.5"/><text class="legend" x="657" y="64">SarkiAI engine</text>
<rect x="515" y="52" width="14" height="14" rx="4" fill="#14263F" stroke="#5AA9FF" stroke-width="2"/><text class="legend" x="537" y="64">Meta model</text>
<rect x="44" y="150" width="290" height="120" rx="14" fill="#2B1D1C" stroke="#FF8A65" stroke-width="2"/>
<text class="name" x="62" y="178">You ask</text>
<text class="sub" x="62" y="202">Type, dictate or attach an image</text>
<text class="sub" x="62" y="222">Pick a mandated institution</text>
<rect x="44" y="310" width="290" height="120" rx="14" fill="#14263F" stroke="#5AA9FF" stroke-width="2"/>
<text class="tag" x="62" y="338">META MODEL · SPEECH</text>
<text class="name" x="62" y="364">Muse Voice Transcribe</text>
<text class="sub" x="62" y="388">Realtime WebSocket</text>
<text class="sub" x="62" y="408">Words appear as you talk</text>
<rect x="44" y="470" width="290" height="120" rx="14" fill="#151D2C" stroke="#2A3648" stroke-width="1.5"/>
<text class="tags" x="62" y="498">ATTACHMENTS</text>
<text class="name" x="62" y="524">Media library</text>
<text class="sub" x="62" y="548">Images uploaded at selection,</text>
<text class="sub" x="62" y="568">sent as references, not base64</text>
<rect x="390" y="270" width="320" height="200" rx="14" fill="#14263F" stroke="#5AA9FF" stroke-width="2"/>
<text class="tag" x="408" y="298">META MODEL · THE BRAIN</text>
<text class="name" x="408" y="324">Muse Spark 1.3</text>
<text class="sub" x="408" y="348">Or the model the operator chose:</text>
<text class="sub" x="408" y="368">Muse Spark Open, Muse Glimmer</text>
<text class="sub" x="408" y="388">Reads attached images</text>
<text class="sub" x="408" y="408">Streams its answer and its</text>
<text class="sub" x="408" y="428">tool calls</text>
<rect x="770" y="140" width="386" height="110" rx="14" fill="#14263F" stroke="#5AA9FF" stroke-width="2"/>
<text class="tag" x="788" y="168">TOOL · AGENTIC SEARCH</text>
<text class="name" x="788" y="194">search_corpus</text>
<text class="sub" x="788" y="218">Depth deep: plan, sub-agents,</text>
<text class="sub" x="788" y="238">judge loops, Meta ranking</text>
<rect x="770" y="270" width="386" height="96" rx="14" fill="#151D2C" stroke="#2A3648" stroke-width="1.5"/>
<text class="tags" x="788" y="298">TOOL</text>
<text class="name" x="788" y="324">record_gap</text>
<text class="sub" x="788" y="348">Says what the law does not cover</text>
<rect x="770" y="386" width="386" height="110" rx="14" fill="#121925" stroke="#50627C" stroke-width="1.5" stroke-dasharray="6 5"/>
<text class="tags" x="788" y="414">TOOL · MCP</text>
<text class="name" x="788" y="440">MCP apps</text>
<text class="sub" x="788" y="464">mcp_list_tools, mcp_call_tool:</text>
<text class="sub" x="788" y="484">charts and documents in the chat</text>
<rect x="770" y="516" width="386" height="110" rx="14" fill="#2B1D1C" stroke="#FF8A65" stroke-width="2"/>
<text class="tagh" x="788" y="544">TOOL · HUMAN IN THE LOOP</text>
<text class="name" x="788" y="570">ask_user · request_approval</text>
<text class="sub" x="788" y="594">The agent proposes,</text>
<text class="sub" x="788" y="614">an operator decides</text>
<rect x="390" y="560" width="320" height="110" rx="14" fill="#151D2C" stroke="#2A3648" stroke-width="1.5"/>
<text class="tags" x="408" y="588">GUARD</text>
<text class="name" x="408" y="614">Citation validator</text>
<text class="sub" x="408" y="638">Every quote checked against</text>
<text class="sub" x="408" y="658">the corpus before it is shown</text>
<rect x="44" y="650" width="290" height="110" rx="14" fill="#2B1D1C" stroke="#FF8A65" stroke-width="2"/>
<text class="name" x="62" y="678">The answer</text>
<text class="sub" x="62" y="702">Clickable sources, recorded</text>
<text class="sub" x="62" y="722">in the hash-chained audit trail</text>
</svg>
