<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 770" width="1200" height="770" role="img" aria-labelledby="t d">
<title id="t">SarkiAI Policy Sandbox architecture overview</title>
<desc id="d">Operators use the Next.js console, which calls the Fastify API. The API keeps the corpus, the audit log and the chain-of-thought in MongoDB, and sends each reasoning step to the Meta model chosen by the operator: Muse Spark on the Meta Model API in the cloud, Muse Spark Open served by Baseten in sovereign mode, or Muse Glimmer on Ollama on the institution's own hardware. SAM 3.1, Muse Voice Transcribe, Muse Image and the built-in web search run on the Meta Model API. Focal points are notified through the WhatsApp Cloud API and e-mail; charts and documents come from MCP apps.</desc>
<defs><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#50627C"/></marker>
<marker id="am" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#5AA9FF"/></marker></defs>
