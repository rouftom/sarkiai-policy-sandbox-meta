<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 854" width="1200" height="854" role="img" aria-labelledby="t d">
<title id="t">SarkiAI Policy Sandbox architecture overview</title>
<desc id="d">Operators use the web console, which calls the API. The API keeps the corpus, the audit log and the chain-of-thought in MongoDB, and sends each reasoning step to the Meta model chosen by the operator: Muse Spark on the Meta Model API in the cloud, Muse Spark Open served by Baseten in sovereign mode, or Muse Glimmer on Ollama on the institution's own hardware. SAM 3.1, Muse Voice Transcribe, Muse Image and the built-in web search run on the Meta Model API. Focal points are notified on WhatsApp or by e-mail; charts and documents come from MCP apps.</desc>
