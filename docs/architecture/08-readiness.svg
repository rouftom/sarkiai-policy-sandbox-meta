<rect x="360" y="280" width="380" height="96" rx="14" fill="#151D2C" stroke="#2A3648" stroke-width="1.5"/>
<text class="tags" x="378" y="308">RETRIEVAL</text>
<text class="name" x="378" y="334">Corpus evidence</text>
<text class="sub" x="378" y="358">Agentic search on the national law</text>
<rect x="360" y="396" width="380" height="130" rx="14" fill="#14263F" stroke="#5AA9FF" stroke-width="2"/>
<text class="tag" x="378" y="424">META MODEL · E.G. MUSE SPARK OPEN</text>
<text class="name" x="378" y="450">Dimension agents</text>
<text class="sub" x="378" y="474">One per dimension and sector</text>
<text class="sub" x="378" y="494">Score and justification, on the</text>
<text class="sub" x="378" y="514">model chosen per task</text>
<rect x="800" y="150" width="356" height="130" rx="14" fill="#14263F" stroke="#5AA9FF" stroke-width="2"/>
<text class="tag" x="818" y="178">META MODEL</text>
<text class="name" x="818" y="204">Synthesis</text>
<text class="sub" x="818" y="228">Composite score and summary</text>
<text class="sub" x="818" y="248">for each sector</text>
<rect x="800" y="320" width="356" height="150" rx="14" fill="#151D2C" stroke="#2A3648" stroke-width="1.5"/>
<text class="tags" x="818" y="348">OUTPUT</text>
<text class="name" x="818" y="374">Bilingual report</text>
<text class="sub" x="818" y="398">Markdown, HTML and Word</text>
<text class="sub" x="818" y="418">Charts from MCP apps</text>
<text class="sub" x="818" y="438">Comparison across sectors</text>
<rect x="800" y="500" width="356" height="96" rx="14" fill="#14263F" stroke="#5AA9FF" stroke-width="2"/>
<text class="tag" x="818" y="528">META MODEL · IMAGE</text>
<text class="name" x="818" y="554">Muse Image</text>
<text class="sub" x="818" y="578">Draws the report cover</text>
<text class="note" x="44" y="670" text-anchor="start">Every stage records the model that ran it, so a ministry can show which model produced which score.</text>
</svg>
