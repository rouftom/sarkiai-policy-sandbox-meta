<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 720" width="1200" height="720" role="img" aria-labelledby="t d">
<title id="t">SarkiAI Policy Sandbox: an AI-readiness assessment</title>
<desc id="d">A ministry chooses up to five sectors and the dimensions to evaluate, thirteen by default. For each sector, one agent per dimension gathers evidence: the agentic corpus search on the national law, and live sources through the built-in web search of the Meta Model API on Muse Spark. The evaluation and the synthesis run on the model chosen per task, such as Muse Spark Open. Three execution modes are available: parallel, sequential, or orchestrated by a lead agent. The result is a bilingual report in Markdown, HTML and Word, with charts from MCP apps and a cover drawn by Muse Image, and a comparison across sectors.</desc>
<defs><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#50627C"/></marker>
<marker id="am" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#5AA9FF"/></marker></defs>
<style>
