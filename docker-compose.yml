# ─────────────────────────────────────────────────────────────────────────────
# SarkiAI Policy Sandbox · full stack, LOCAL-ONLY (sovereign)
#
#   docker compose up --build                 # everything (no cloud calls)
#
# The only model is Muse Glimmer (Meta open weights), served by Ollama. MongoDB
# holds the corpus (text index), the audit log and the chain-of-thought.
# ─────────────────────────────────────────────────────────────────────────────

name: sarkiai-policy-sandbox

x-common-env: &common-env
  NODE_ENV: ${NODE_ENV:-development}
  SERVICE_API_KEY: ${SERVICE_API_KEY:-change-me-service-key}

services:
  # ── Local model server (Muse Glimmer) ───────────────────────────────────
  ollama:
    image: ollama/ollama:latest
    container_name: sps-ollama
    restart: unless-stopped
    ports:
      - "${SERVICES_BIND_ADDRESS:-127.0.0.1}:${OLLAMA_PORT:-11434}:11434"
    volumes:
      - ollama-data:/root/.ollama
    # GPU support (uncomment for NVIDIA):
    # deploy:
    #   resources:
    #     reservations:
    #       devices:
    #         - driver: nvidia
    #           count: all
    #           capabilities: [gpu]
    healthcheck:
      test: ["CMD-SHELL", "ollama list >/dev/null 2>&1 || exit 1"]
      interval: 15s
      timeout: 10s
      retries: 10
      start_period: 30s
    networks: [sps-net]

  # ── Corpus, audit log and chain-of-thought ─────────────────────────────
  mongo:
    image: mongo:7.0
    container_name: sps-mongo
    restart: unless-stopped
    ports:
      - "${SERVICES_BIND_ADDRESS:-127.0.0.1}:${MONGO_PORT:-27017}:27017"
    volumes:
      - mongo-data:/data/db
    environment:
      MONGO_INITDB_DATABASE: ${MONGODB_DB_NAME:-policy_sandbox}
    healthcheck:
      test: ["CMD", "mongosh", "--quiet", "--eval", "db.adminCommand('ping').ok"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 15s
    networks: [sps-net]

  # ── Object storage (assistant image attachments) ───────────────────────────
  # MinIO: S3-compatible, local bucket. Content-addressed (sha256) objects.
  minio:
    image: minio/minio:latest
    container_name: sps-minio
    restart: unless-stopped
    command: ["server", "/data", "--console-address", ":9001"]
    environment:
      MINIO_ROOT_USER: ${S3_ACCESS_KEY:-sps-minio}
      MINIO_ROOT_PASSWORD: ${S3_SECRET_KEY:-sps-minio-secret}
    volumes:
      - minio-data:/data
    ports:
      - "${SERVICES_BIND_ADDRESS:-127.0.0.1}:${MINIO_PORT:-9000}:9000"
      - "${SERVICES_BIND_ADDRESS:-127.0.0.1}:${MINIO_CONSOLE_PORT:-9001}:9001"
    healthcheck:
      test: ["CMD", "mc", "ready", "local"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 10s
    networks: [sps-net]

  # Creates the attachments bucket once MinIO is up (idempotent).
  minio-init:
    image: minio/mc:latest
    container_name: sps-minio-init
    depends_on:
      minio:
        condition: service_healthy
    entrypoint:
      - sh
      - -c
      - >
        mc alias set local http://minio:9000 "$$MINIO_ROOT_USER" "$$MINIO_ROOT_PASSWORD" &&
        mc mb --ignore-existing local/"$$S3_BUCKET" &&
        echo "bucket ready: $$S3_BUCKET"
    environment:
      MINIO_ROOT_USER: ${S3_ACCESS_KEY:-sps-minio}
      MINIO_ROOT_PASSWORD: ${S3_SECRET_KEY:-sps-minio-secret}
      S3_BUCKET: ${S3_BUCKET:-sps-attachments}
    restart: "no"
    networks: [sps-net]

  # ── MCP tools (local copies of the charts and Word servers) ─────────────────
  # Auth is off locally; the API and the console reach them on the sps-net network.
  mcp-charts:
    build:
      context: services/mcp-charts
    image: sarkiai/sps-mcp-charts:local
    container_name: sps-mcp-charts
    restart: unless-stopped
    environment:
      PORT: "3000"
      MCP_AUTH_DISABLED: "true"
    ports:
      - "${SERVICES_BIND_ADDRESS:-127.0.0.1}:${MCP_CHARTS_PORT:-8010}:3000"
    healthcheck:
      test: ["CMD", "bun", "-e", "fetch('http://localhost:3000/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 20s
    networks: [sps-net]

  mcp-docx:
    build:
      context: services/mcp-docx
    image: sarkiai/sps-mcp-docx:local
    container_name: sps-mcp-docx
    restart: unless-stopped
    environment:
      PORT: "3000"
      MCP_AUTH_DISABLED: "true"
    ports:
      - "${SERVICES_BIND_ADDRESS:-127.0.0.1}:${MCP_DOCX_PORT:-8011}:3000"
    healthcheck:
      test: ["CMD", "bun", "-e", "fetch('http://localhost:3000/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 20s
    networks: [sps-net]

  # ── Application plane ──────────────────────────────────────────────────────
  api:
    build:
      context: .
      dockerfile: apps/api/Dockerfile
    image: sarkiai/sps-api:local
    container_name: sps-api
    restart: unless-stopped
    depends_on:
      mongo:
        condition: service_healthy
      ollama:
        condition: service_healthy
      mcp-charts:
        condition: service_healthy
      mcp-docx:
        condition: service_healthy
    env_file:
      - .env
    environment:
      <<: *common-env
      PORT: "8000"
      SANDBOX_MODE: ${SANDBOX_MODE:-local}
      RETRIEVAL_BACKEND: ${RETRIEVAL_BACKEND:-auto}
      RETRIEVAL_DEPTH: ${RETRIEVAL_DEPTH:-fast}
      MONGODB_URI: ${MONGODB_URI:-mongodb://mongo:27017}
      MONGODB_DB_NAME: ${MONGODB_DB_NAME:-policy_sandbox}
      MONGODB_RAG_COLLECTION: ${MONGODB_RAG_COLLECTION:-kb_chunks}
      MONGODB_TEXT_INDEX: ${MONGODB_TEXT_INDEX:-sps_text_index}
      MONGODB_AUTO_INDEXES: ${MONGODB_AUTO_INDEXES:-true}
      OLLAMA_BASE_URL: ${OLLAMA_BASE_URL:-http://ollama:11434}
      OLLAMA_MODEL: ${OLLAMA_MODEL:-muse-glimmer}
      S3_ENDPOINT: ${S3_ENDPOINT:-http://minio:9000}
      S3_BUCKET: ${S3_BUCKET:-sps-attachments}
      S3_ACCESS_KEY: ${S3_ACCESS_KEY:-sps-minio}
      S3_SECRET_KEY: ${S3_SECRET_KEY:-sps-minio-secret}
      # Empty means "not configured": the API then keeps the historical
      # permissive CORS policy and builds links to localhost:3000, so a LAN
      # install or a remapped port works without editing the file. Set it for a
      # public host; add WEB_PUBLIC_URL_ALIASES for other names it answers on.
      WEB_PUBLIC_URL: ${WEB_PUBLIC_URL:-}
      WEB_PUBLIC_URL_ALIASES: ${WEB_PUBLIC_URL_ALIASES:-}
      WEB_ALLOW_ANY_ORIGIN: ${WEB_ALLOW_ANY_ORIGIN:-}
      MCP_CHARTS_URL: http://mcp-charts:3000/mcp
      MCP_DOCX_URL: http://mcp-docx:3000/mcp
    ports:
      - "${API_PORT:-8000}:8000"
    healthcheck:
      test: ["CMD", "bun", "-e", "fetch('http://localhost:8000/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 20s
    networks: [sps-net]

  web:
    build:
      context: .
      dockerfile: apps/web/Dockerfile
      args:
        NEXT_PUBLIC_API_URL: ${NEXT_PUBLIC_API_URL:-http://localhost:8000}
        NEXT_PUBLIC_WEB_URL: ${NEXT_PUBLIC_WEB_URL:-}
        NEXT_PUBLIC_WEB_ORIGINS: ${NEXT_PUBLIC_WEB_ORIGINS:-}
    image: sarkiai/sps-web:local
    container_name: sps-web
    restart: unless-stopped
    depends_on:
      api:
        condition: service_healthy
    environment:
      <<: *common-env
      PORT: "3000"
      NEXT_PUBLIC_API_URL: ${NEXT_PUBLIC_API_URL:-http://localhost:8000}
      MCP_CHARTS_URL: http://mcp-charts:3000/mcp
      MCP_DOCX_URL: http://mcp-docx:3000/mcp
    ports:
      - "${WEB_PORT:-3000}:3000"
    healthcheck:
      test: ["CMD", "bun", "-e", "fetch('http://localhost:3000').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 20s
      timeout: 5s
      retries: 5
      start_period: 30s
    networks: [sps-net]

volumes:
  ollama-data:
  mongo-data:
  minio-data:

networks:
  sps-net:
    driver: bridge
