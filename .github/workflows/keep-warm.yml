name: keep-warm

# Some free hosting plans stop idle instances. A scheduled ping keeps the public
# API answering on demo day. Set the repository variable once:
#   gh variable set SPS_API_URL --body https://<api-host>
# Without the variable the job exits immediately.

on:
  schedule:
    - cron: '*/10 * * * *'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  ping:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - name: Ping /health
        env:
          SPS_API_URL: ${{ vars.SPS_API_URL }}
        run: |
          if [ -z "$SPS_API_URL" ]; then
            echo "SPS_API_URL is not set; skipping."
            exit 0
          fi
          for i in 1 2 3; do
            code=$(curl -s -o /dev/null -w '%{http_code}' --max-time 20 "$SPS_API_URL/health" || true)
            echo "attempt $i -> $code"
            [ "$code" = "200" ] && exit 0
            sleep 10
          done
          echo "API did not answer 200" >&2
          exit 1
