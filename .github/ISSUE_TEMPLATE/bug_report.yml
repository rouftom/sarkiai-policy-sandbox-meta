name: Bug report
description: Report incorrect behaviour in the console, the API, the ingestion service or the docs.
title: "[bug]: <short description>"
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for the report. Search existing issues first, and do **not** include a secret, a token or personal data — see [SECURITY.md](/SECURITY.md) for vulnerabilities.

  - type: textarea
    id: summary
    attributes:
      label: What happened?
      description: A clear description of the incorrect behaviour.
    validations:
      required: true

  - type: textarea
    id: expected
    attributes:
      label: What did you expect?
    validations:
      required: true

  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
      placeholder: |
        1. Open ...
        2. Click ...
        3. Observe ...
    validations:
      required: true

  - type: dropdown
    id: component
    attributes:
      label: Component
      options:
        - Web console (apps/web)
        - API (apps/api)
        - Ingestion service (services/ingestion)
        - Knowledge base / retrieval
        - Readiness, scenarios or exercises
        - Deployment / configuration
        - Documentation
        - Other
    validations:
      required: true

  - type: input
    id: environment
    attributes:
      label: Environment
      description: Local stack, sandbox, hosted instance, and the commit or branch if known.
      placeholder: "Hosted https://sps.djotta.com · develop @ 8d20c4f"
    validations:
      required: false

  - type: textarea
    id: logs
    attributes:
      label: Relevant logs or screenshots
      description: Redact tokens, cookies, connection strings and personal data before pasting.
    validations:
      required: false

  - type: checkboxes
    id: hygiene
    attributes:
      label: Before submitting
      options:
        - label: I removed secrets and personal data from logs, screenshots and the description.
          required: true
