name: Feature request
description: Suggest a capability, an improvement or a corpus addition.
title: "[feat]: <short description>"
labels: ["enhancement"]
body:
  - type: textarea
    id: problem
    attributes:
      label: Problem
      description: What need or gap does this address?
    validations:
      required: true

  - type: textarea
    id: proposal
    attributes:
      label: Proposed solution
      description: What would you like to see? Alternatives are welcome too.
    validations:
      required: true

  - type: dropdown
    id: area
    attributes:
      label: Area
      options:
        - Web console
        - API
        - Ingestion / knowledge base
        - Readiness and scenarios
        - Corpus and rights
        - Accessibility
        - Documentation
        - Other
    validations:
      required: true

  - type: textarea
    id: rights
    attributes:
      label: For a corpus addition
      description: Give the issuer, the source URL and the reuse rights (official-text, open-licence, quotation-only, to-confirm). See [docs/LICENSING.md](/docs/LICENSING.md).
    validations:
      required: false

  - type: checkboxes
    id: conduct
    attributes:
      label: Code of Conduct
      options:
        - label: I agree to follow this project's Code of Conduct.
          required: true
