# ─────────────────────────────────────────────────────────────────────────────
# Dev override — hot reload + bind mounts.
#
#   docker compose -f docker-compose.yml -f docker-compose.dev.yml up
#   docker compose -f docker-compose.yml -f docker-compose.dev.yml up api web
# ─────────────────────────────────────────────────────────────────────────────

name: sarkiai-policy-sandbox

services:
  ingestion:
    volumes:
      - ./services/ingestion/src:/app/src
      - ./services/ingestion/tests:/app/tests
    command: ["uvicorn", "rag_ingestion.main:app", "--host", "0.0.0.0", "--port", "8000", "--reload"]

  ocr:
    volumes:
      - ./services/ocr/app:/app/app
    command: ["uvicorn", "app.main:app", "--host", "0.0.0.0", "--port", "8000", "--reload"]

  transcription:
    volumes:
      - ./services/transcription/app:/app/app
    command: ["uvicorn", "app.main:app", "--host", "0.0.0.0", "--port", "8000", "--reload"]

  api:
    build:
      target: dev
    volumes:
      - ./apps/api/src:/app/src
      - ./packages:/app/packages
      - ./tsconfig.base.json:/app/tsconfig.base.json:ro
    command: ["bun", "--watch", "src/index.ts"]

  web:
    build:
      target: dev
    volumes:
      - ./apps/web/src:/app/src
      - ./apps/web/public:/app/public
      - ./packages:/app/packages
    command: ["bun", "run", "dev"]
