# ─────────────────────────────────────────────────────────────────────────────
# Dev override · hot reload + bind mounts.
#
#   docker compose -f docker-compose.yml -f docker-compose.dev.yml up
#   docker compose -f docker-compose.yml -f docker-compose.dev.yml up api web
# ─────────────────────────────────────────────────────────────────────────────

name: sarkiai-policy-sandbox

services:
  api:
    build:
      target: dev
    volumes:
      - ./apps/api/src:/app/src
      - ./packages:/app/packages
      - ./tsconfig.base.json:/app/tsconfig.base.json:ro
    command: ["bun", "--watch", "src/index.ts"]

  web:
    build:
      target: dev
    volumes:
      - ./apps/web/src:/app/src
      - ./apps/web/public:/app/public
      - ./packages:/app/packages
    command: ["bun", "run", "dev"]
